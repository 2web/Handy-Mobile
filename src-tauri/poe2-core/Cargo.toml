[package]
name = "poe2-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
chrono = "0.4"
once_cell = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
